# Salinlahi: Model Configuration
# Shared by both ML sub-teams; transformer settings are in a separate block.

model:
  rnn_type: "lstm"          # Options: "rnn", "gru", "lstm"
  embedding_dim: 256        # Size of token embedding vectors
  hidden_size: 512          # Hidden state size for both encoder and decoder
  num_encoder_layers: 2     # Number of stacked RNN layers in the encoder
  dropout: 0.3              # Dropout rate applied to embeddings and between RNN layers
  pad_token_idx: 0          # Token id used for padding — must match the tokenizer

training:
  learning_rate: 0.001
  num_epochs: 10
  batch_size: 64
  teacher_forcing_ratio: 0.5   # Start with 50% teacher forcing
  teacher_forcing_min: 0.1     # Anneal down to 10% by the final epoch
  gradient_clip: 1.0           # Max gradient norm to clip to (prevents exploding gradients)
  lr_decay_factor: 0.5         # Multiply LR by this when val loss plateaus
  lr_patience: 2               # Number of epochs with no improvement before LR decay
  pad_token_idx: 0

paths:
  processed_data_dir: "data/processed"
  model_checkpoint_dir: "models/recurrent"
  log_dir: "logs"

# Language pairs this model will be trained on
# Each entry is one Filipino-to-regional-language translation direction
language_pairs:
  - source: "fil"
    target: "war"   # Waray
